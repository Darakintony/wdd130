<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic quiz form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main class="box">
        <h1>Basic HTML and CSS quiz</h1>

        <form class="box">
            <div class="quiz-item box">
                <label for="q1">1. What is the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="quiz-item box">
                <label for="q2">2. How are id and class attribute seleted in CSS?</label>
                <textarea id="q2" name="q2"></textarea>
            </div>

            <div class="quiz-item box">
                <label for="q3">3. Which of the following is the valid CSS comment?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled> Choose one ...</option>
                    <option value="a">A. &lt;!-- this is a comment --&gt;</option>
                    <option value="b">B. /* this is a comment*/</option>
                    <option value="c">C. // this is a comment</option>
                </select>
                <!-- <input type="text" id="q3" name="q3"> -->
            </div>

            <div class="quiz-item box">
                <label for="q4">4. Whaat is the bottom margin given this declaration?</label>
                <code class="box">margin: 10px 5px 15px;</code>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Submit Quiz for Grading</button>
        </form>
    </main>
</body>

</html>
