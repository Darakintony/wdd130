<Doctype>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="styles/poll-form.css">
    </head>

    <body>

        <header>
            <h1>WED 130 | HTML Form - user poll</h1>
        </header>
        <form>
            <fieldset>
                <legend>Contact information</legend>
                <div class="form-item label-narrow">
                    <label for="fullname">Fullname</label>
                    <input type="text" id="fullname" name="fullname">
                </div>

                <div class="form-item label-narrow">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail">
                </div>
            </fieldset>

            <fieldset>
                <legend>Questions</legend>
                <div class="form-item label-wide">
                    <label for="browser"> What is your favorite browser?</label>
                    <select name="browser" id="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="brave">Brave</option>
                        <option value="edge">Edge</option>
                        <option value="othhers">Others</option>
                    </select>
                </div>


                <div class="form-item label-wide">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <div class="form-item">
                    <label for="places"> List a place you have live</label>
                    <textarea name="places" id="places" rows="4" placeholder="Ftillwater Florida, Amsterdan Netherland, Timbuktu Mali"></textarea>
                </div>
            </fieldset>

            <button type="submit">Subnit poll </button>

        </form>


    </body>

    </html>
